<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".38" r=".75">
      <stop offset="0" stop-color="#3B2A55"/>
      <stop offset=".55" stop-color="#121833"/>
      <stop offset="1" stop-color="#070B14"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFD98A" stop-opacity=".75"/>
      <stop offset="1" stop-color="#FFB45A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".4" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".32"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF4C2"/>
      <stop offset=".3" stop-color="#F1CB68"/>
      <stop offset=".65" stop-color="#CC9A32"/>
      <stop offset="1" stop-color="#8A5C12"/>
    </linearGradient>
    <linearGradient id="holo" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5BA8"/>
      <stop offset=".25" stop-color="#FFD84F"/>
      <stop offset=".5" stop-color="#57F2B5"/>
      <stop offset=".75" stop-color="#58A8FF"/>
      <stop offset="1" stop-color="#B05BFF"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".6"/></filter>
    <clipPath id="slab"><rect x="126" y="52" width="260" height="410" rx="22"/></clipPath>
  </defs>

  <!-- fondo de la opción B: violeta nocturno, resplandor dorado y destellos -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="230" fill="url(#glow)"/>
  <g fill="#FFF3CF">
    <path d="M70 118 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5z" opacity=".8"/>
    <path d="M440 96 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4z" opacity=".7"/>
    <path d="M444 392 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z" opacity=".85"/>
    <circle cx="78" cy="400" r="4" opacity=".6"/>
    <circle cx="420" cy="232" r="3" opacity=".6"/>
  </g>

  <!-- slab PSA 10 -->
  <g filter="url(#sh)">
    <rect x="126" y="52" width="260" height="410" rx="22" fill="#0E1426" fill-opacity=".55"/>
    <rect x="126" y="52" width="260" height="410" rx="22" fill="url(#case)"/>
    <rect x="146" y="70" width="220" height="74" rx="8" fill="#F4F4EF" stroke="#C9283A" stroke-width="6"/>
    <rect x="162" y="88" width="104" height="10" rx="5" fill="#15181A" fill-opacity=".75"/>
    <rect x="162" y="106" width="80" height="9" rx="4.5" fill="#15181A" fill-opacity=".45"/>
    <rect x="162" y="122" width="62" height="8" rx="4" fill="#15181A" fill-opacity=".35"/>
    <text x="340" y="128" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="46" fill="#15181A">10</text>
    <rect x="160" y="164" width="192" height="274" rx="10" fill="url(#gold)"/>
    <rect x="176" y="180" width="160" height="140" rx="6" fill="url(#holo)" opacity=".9"/>
    <rect x="176" y="180" width="160" height="140" rx="6" fill="#fff" opacity=".12"/>
    <path d="M256 204 L268 232 L298 236 L275 256 L282 286 L256 270 L230 286 L237 256 L214 236 L244 232 Z" fill="#FFFDF2"/>
    <rect x="176" y="338" width="160" height="12" rx="6" fill="#3A2606" fill-opacity=".45"/>
    <rect x="176" y="362" width="104" height="12" rx="6" fill="#3A2606" fill-opacity=".3"/>
    <rect x="176" y="386" width="132" height="12" rx="6" fill="#3A2606" fill-opacity=".3"/>
    <!-- brillo diagonal de la opción B, sobre todo el slab -->
    <g clip-path="url(#slab)">
      <rect x="0" y="232" width="512" height="52" fill="url(#shine)" transform="rotate(-38 256 258)" opacity=".75"/>
      <rect x="0" y="300" width="512" height="14" fill="url(#shine)" transform="rotate(-38 256 258)" opacity=".45"/>
    </g>
    <rect x="126" y="52" width="260" height="410" rx="22" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="4"/>
  </g>
</svg>
